name: paths
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find CodeQL
        run: |
          set -eu
          q=$(ls -d /opt/hostedtoolcache/CodeQL/*/x64/codeql/codeql | sort -V | tail -1)
          echo "CODEQL=$q" >> "$GITHUB_ENV"
          "$q" version
      - name: Database
        run: $CODEQL database create db --language=cpp --source-root=src --command="cc -c fx.c -o /tmp/fx.o" --overwrite
      - name: Queries
        run: |
          set -eux
          $CODEQL pack install queries
          mkdir -p out
          for q in Paths PathsClamped; do
            $CODEQL query run queries/$q.ql -d db -o out/$q.bqrs
            $CODEQL bqrs info out/$q.bqrs
            $CODEQL bqrs decode out/$q.bqrs --format=json --entities=id,url,string --output=out/$q.json
            $CODEQL database analyze db queries/$q.ql --format=sarif-latest --output=out/$q.sarif --max-paths=1000 --rerun
          done
      - uses: actions/upload-artifact@v4
        with:
          name: paths
          path: out
